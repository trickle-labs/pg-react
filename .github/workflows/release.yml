name: Release v0.24.0

on:
  push:
    tags:
      - v0.24.0

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fetch inherited release tag
        run: git fetch --no-tags origin refs/tags/v0.23.0:refs/tags/v0.23.0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Verify release identity
        run: |
          grep -qx 'version = "0.24.0"' Cargo.toml
          grep -qx "default_version = '0.24.0'" pg_react.control
      - name: Require unpublished release
        run: "! gh release view v0.24.0 >/dev/null 2>&1"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo fmt --check
      - run: cargo test --no-default-features
      - name: Audit dependencies
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit
      - name: Check pgrx PostgreSQL 18 skeleton
        run: >-
          docker run --rm
          -v "$PWD:/work:ro"
          -v /work/target
          -w /work
          ghcr.io/trickle-labs/pg-trickle/builder@sha256:8d0446c21ab3273b55c045a39c49120e9d7cde8e970954c3f81e7bee194fad95
          cargo check --features pg18
      - name: Name image
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:v0.24.0" >> "$GITHUB_ENV"
      - name: Fetch inherited release image
        run: docker pull "ghcr.io/${GITHUB_REPOSITORY,,}:v0.23.0" && docker tag "ghcr.io/${GITHUB_REPOSITORY,,}:v0.23.0" pg-react:v0.23.0
      - name: Build and test release image
        run: docker build --tag "$IMAGE" . && M27_ARTIFACT_DIR="$PWD/m27-evidence" bash tests/m27.sh complete "$IMAGE"
      - name: Publish image
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          push_output=$(docker push "$IMAGE" 2>&1)
          printf '%s\n' "$push_output"
          image_digest=$(printf '%s\n' "$push_output" | sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | tail -n 1)
          test -n "$image_digest"
          echo "IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest published image
        id: attest_image
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
      - name: Package image, evidence, SBOM, and checksums
        run: |
          artifact=pg-react-v0.24.0-linux-amd64.tar.gz
          docker save "$IMAGE" | gzip -n -9 > "$artifact"
          bash tests/m18-sbom.sh "$IMAGE" pg-react-v0.24.0.spdx.json
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf - m27-evidence | gzip -n -9 > pg-react-v0.24.0-evidence.tar.gz
          sha256sum "$artifact" pg-react-v0.24.0-evidence.tar.gz pg-react-v0.24.0.spdx.json > pg-react-v0.24.0.SHA256SUMS
          printf '# OCI image: %s@%s\n' "$IMAGE" "$IMAGE_DIGEST" >> pg-react-v0.24.0.SHA256SUMS
          sha256sum --check pg-react-v0.24.0.SHA256SUMS
      - name: Attest release artifacts
        id: attest_artifacts
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: pg-react-v0.24.0-linux-amd64.tar.gz, pg-react-v0.24.0-evidence.tar.gz
      - name: Attest release SBOM
        id: attest_sbom
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          sbom-path: pg-react-v0.24.0.spdx.json
          push-to-registry: true
      - name: Collect signed attestation bundles
        run: |
          cp "${{ steps.attest_image.outputs.bundle-path }}" pg-react-v0.24.0-image.provenance.json
          cp "${{ steps.attest_artifacts.outputs.bundle-path }}" pg-react-v0.24.0-artifacts.provenance.json
          cp "${{ steps.attest_sbom.outputs.bundle-path }}" pg-react-v0.24.0-sbom.attestation.json
      - name: Publish release artifacts
        run: |
          artifact=pg-react-v0.24.0-linux-amd64.tar.gz
          gh release create v0.24.0 "$artifact" pg-react-v0.24.0-evidence.tar.gz pg-react-v0.24.0.SHA256SUMS pg-react-v0.24.0.spdx.json pg-react-v0.24.0-image.provenance.json pg-react-v0.24.0-artifacts.provenance.json pg-react-v0.24.0-sbom.attestation.json --verify-tag \
            --notes-file docs/m27-release-notes.md --title v0.24.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

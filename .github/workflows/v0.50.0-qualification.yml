name: v0.50.0 qualification

on:
  pull_request:
    paths:
      - .github/workflows/v0.50.0-qualification.yml
      - .github/workflows/qualification.yml
      - Cargo.lock
      - Cargo.toml
      - Dockerfile
      - ROADMAP.md
      - contracts/**
      - docs/v0.50.0-*.md
      - integrations/pg-mdm/**
      - plans/v0.50.0.md
      - sql/**
      - src/**
      - tests/integrations/pg-mdm/**
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  common:
    uses: ./.github/workflows/qualification.yml
    with:
      image: pg-react:v0.50.0-qualification

  v050:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare v0.50 evidence directory
        run: mkdir -p v0.50.0-evidence
      - name: Test qualification manifest validation
        run: python3 tests/integrations/pg-mdm/test_v050_qualification.py
      - name: Run documented operational queries on PostgreSQL 18.6
        run: |
          set -euo pipefail
          container=pgreact-v050-ops-${GITHUB_RUN_ID}
          cleanup() { docker stop "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --rm --detach --name "$container" \
            --env POSTGRES_PASSWORD=v050-test \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            postgres:18.6 >/dev/null
          ready=
          for attempt in {1..30}; do
            if docker exec "$container" pg_isready -U postgres >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test -n "$ready"
          python3 tests/integrations/pg-mdm/test_v050_operations.py \
            "$container" --output v0.50.0-evidence/operational-query-results.json
      - name: Require complete real-stack release evidence
        run: |
          python3 tests/integrations/pg-mdm/derive_v050_qualification.py \
            --require-qualified > v0.50.0-evidence/qualification-result.json
      - name: Upload v0.50 fixture evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v0.50.0-qualification-${{ github.run_id }}
          path: v0.50.0-evidence/

name: Canonical qualification

on:
  workflow_call:
    inputs:
      image:
        required: false
        type: string
        default: pg-react:m55-unreleased

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Create evidence directory
        run: mkdir -p m55-evidence
      - name: Rust format
        run: cargo fmt --check
      - name: Rust tests
        run: cargo test --no-default-features
      - name: Dependency audit
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit
      - name: PostgreSQL 18 skeleton
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            -v /work/target \
            -w /work \
            ghcr.io/trickle-labs/pg-trickle/builder@sha256:8d0446c21ab3273b55c045a39c49120e9d7cde8e970954c3f81e7bee194fad95 \
            cargo check --features pg18
      - name: Build candidate
        run: |
          set +e
          docker build --tag "${{ inputs.image }}" . > m55-evidence/build.log 2>&1
          status=$?
          set -e
          exit "$status"
      - name: Current documentation audit
        run: bash tests/current-docs.sh
      - name: Workflow syntax audit
        run: bash tests/workflow-syntax.sh
      - name: API inventory audit
        env:
          API_INVENTORY_ARTIFACT: ${{ github.workspace }}/m55-evidence/installed-api-catalog.json
        run: bash tests/api-inventory.sh "${{ inputs.image }}"
      - name: Run complete candidate qualification
        env:
          M55_ARTIFACT_DIR: ${{ github.workspace }}/m55-evidence
        run: bash tests/qualification.sh complete "${{ inputs.image }}"
      - name: Archive candidate image
        run: |
          mkdir -p m55-evidence
          docker image inspect --format '{{.Id}}' "${{ inputs.image }}" > m55-evidence/candidate-image.txt
          docker save "${{ inputs.image }}" | gzip -n -9 > m55-evidence/m55-candidate-image.tar.gz
          sha256sum m55-evidence/m55-candidate-image.tar.gz > m55-evidence/m55-candidate-image.SHA256SUMS
      - name: Write evidence manifest
        run: |
          set -eu
          evidence_dir=m55-evidence
          test -s "$evidence_dir/candidate-image.txt"
          test -s "$evidence_dir/m55-candidate-image.tar.gz"
          test -s "$evidence_dir/m55-candidate-image.SHA256SUMS"
          entries='[]'
          while IFS= read -r artifact; do
            test -s "$artifact"
            digest=$(sha256sum "$artifact" | awk '{print $1}')
            entries=$(jq --arg artifact "$artifact" --arg digest "$digest" \
              '. + [{milestone: "M55", mode: "executed", artifact: $artifact, sha256: $digest}]' <<< "$entries")
          done < <(find "$evidence_dir" -type f ! -name evidence-manifest.json | sort)
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            --argjson entries "$entries" \
            '{schema_version: 1, milestone: "M55", commit: $commit, workflow_run: $run, entries: $entries}' \
            > m55-evidence/evidence-manifest.json
      - name: Write failed evidence manifest
        if: ${{ failure() }}
        run: |
          jq -n \
            --arg commit "${GITHUB_SHA}" \
            --arg run "${GITHUB_RUN_ID}" \
            '{schema_version: 1, milestone: "M55", status: "failed",
              commit: $commit, workflow_run: $run,
              missing_steps: ["candidate qualification"]}' \
            > m55-evidence/evidence-manifest.json
      - name: Upload qualified candidate and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m55-qualified-candidate
          path: m55-evidence/

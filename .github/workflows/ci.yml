name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test --no-default-features
      - name: Check pgrx PostgreSQL 18 skeleton
        run: >-
          docker run --rm
          -v "$PWD:/work:ro"
          -v /work/target
          -w /work
          ghcr.io/trickle-labs/pg-trickle/builder@sha256:8d0446c21ab3273b55c045a39c49120e9d7cde8e970954c3f81e7bee194fad95
          cargo check --features pg18

  environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: bash tests/m8.sh pg-react:v0.5.0

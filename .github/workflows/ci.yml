name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.89.0
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test --no-default-features
      - name: Check pgrx PostgreSQL 18 skeleton
        run: >-
          docker run --rm
          -v "$PWD:/work:ro"
          -v /work/target
          -w /work
          ghcr.io/trickle-labs/pg-trickle/builder@sha256:8d0446c21ab3273b55c045a39c49120e9d7cde8e970954c3f81e7bee194fad95
          cargo check --features pg18

  environment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker compose config --quiet
      - run: >-
          git fetch --no-tags origin
          refs/tags/v0.22.0:refs/tags/v0.22.0
          refs/tags/v0.23.0:refs/tags/v0.23.0
          refs/tags/v0.24.0:refs/tags/v0.24.0
          refs/tags/v0.25.0:refs/tags/v0.25.0
          refs/tags/v0.26.0:refs/tags/v0.26.0
          refs/tags/v0.27.0:refs/tags/v0.27.0
          refs/tags/v0.28.0:refs/tags/v0.28.0 &&
          docker pull "ghcr.io/${GITHUB_REPOSITORY,,}:v0.22.0" &&
          docker tag "ghcr.io/${GITHUB_REPOSITORY,,}:v0.22.0" pg-react:v0.22.0 &&
          docker pull "ghcr.io/${GITHUB_REPOSITORY,,}:v0.23.0" &&
          docker tag "ghcr.io/${GITHUB_REPOSITORY,,}:v0.23.0" pg-react:v0.23.0 &&
          docker pull "ghcr.io/${GITHUB_REPOSITORY,,}:v0.24.0" &&
          docker tag "ghcr.io/${GITHUB_REPOSITORY,,}:v0.24.0" pg-react:v0.24.0 &&
          docker pull "ghcr.io/${GITHUB_REPOSITORY,,}:v0.25.0" &&
          docker tag "ghcr.io/${GITHUB_REPOSITORY,,}:v0.25.0" pg-react:v0.25.0 &&
          docker pull "ghcr.io/${GITHUB_REPOSITORY,,}:v0.26.0" &&
          docker tag "ghcr.io/${GITHUB_REPOSITORY,,}:v0.26.0" pg-react:v0.26.0 &&
          docker pull "ghcr.io/${GITHUB_REPOSITORY,,}:v0.27.0" &&
          docker tag "ghcr.io/${GITHUB_REPOSITORY,,}:v0.27.0" pg-react:v0.27.0 &&
          docker pull "ghcr.io/${GITHUB_REPOSITORY,,}:v0.28.0" &&
          docker tag "ghcr.io/${GITHUB_REPOSITORY,,}:v0.28.0" pg-react:v0.28.0 &&
          docker build --tag pg-react:m32-unreleased . &&
          git worktree add --detach .m30-qualification v0.27.0 &&
          git worktree add --detach .m31-qualification v0.28.0 &&
          trap 'git worktree remove --force .m30-qualification; git worktree remove --force .m31-qualification' EXIT &&
          (cd .m30-qualification && M30_INHERITED_IMAGE=pg-react:v0.26.0 bash tests/m30.sh complete pg-react:v0.27.0) &&
          (cd .m31-qualification && bash tests/m31.sh complete pg-react:v0.28.0) &&
          bash tests/m32.sh complete pg-react:m32-unreleased
